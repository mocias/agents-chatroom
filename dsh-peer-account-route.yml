# Point the shipped `acp` profile at the signed-in DeepSeek *account* route.
#
# Why this file exists: `dsh --profile acp` defaults its agent to
# `provider: deepseek-official`, which is the API-key route. The desktop app is
# signed in on the `deepseek-account` route instead, so without this overlay the
# ACP peer fails every turn with:
#   llm-deepseek: no API key for provider route "deepseek-official"
#
# Pass it to the agent with `--patch <this file>` (see cordis.patch.yml and the
# README section "把 DeepSeek Harness 自己接进来").
- id: agent-default-model
  config:
    provider: deepseek-account
    model: deepseek-v4-flash

- id: acp
  config:
    provider: deepseek-account
    model: deepseek-v4-flash
