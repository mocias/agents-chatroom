# Agent Room profile layer.
#
# The row `name` below MUST stay byte-identical to this package's package.json
# `name` (including any scope). The host compares the row specifier with the
# nearest manifest name and silently drops the client bundle on any mismatch.
- insert:
    - id: agent-room
      name: 'dsh-agent-room'
      config:
        routePrefix: /agent-room
        replyPolicy: addressed
        defaultMode: chat
        # Rooms own live harness processes, and a room id is any string a client
        # picks (the tab mints its own and remembers it in localStorage), so rooms
        # nobody watches are reaped after this long. A room being read keeps its
        # lastUsed fresh, so the one on screen never expires. Set 0 to disable.
        # idleRoomTtlMs: 1800000
        # maxRooms: 16
        # R2: one fixed working directory PER HARNESS, not per room. Every codex
        # member of every room works in the first path; every Qoder member in the
        # third. Sessions are pinned to their directory at creation and cannot
        # be moved afterwards (ACP has no session/set_cwd, and codex fixes cwd at
        # thread/start), so changing a value here only takes effect for members
        # whose session is opened afterwards.
        #
        # Every directory is created at load time if missing — ACP's
        # `session/new {cwd}` rejects a path that does not exist.
        #
        # Omitted here on purpose: the default is
        #   <profile>/agent-room-workspace/<harness>
        # for every harness this build knows, which is what most installs want, and
        # a literal path would have to name one machine's home directory.
        # Uncomment and edit to point `codex` at a folder you made in Codex
        # itself, if you want these conversations to land under that project.
        # workspaceDirs:
        #   codex: 'C:\Users\you\.dsh\profiles\desktop\agent-room-workspace\codex'
        #   qoder: 'C:\Users\you\.dsh\profiles\desktop\agent-room-workspace\qoder'
        # Grouping INSIDE each harness, on top of the directory above. Every room
        # files its codex threads into this one codex project, and its DSH
        # sessions into one DSH workspace at the `dsh` path — so the harness's own
        # GUI shows one workspace holding every conversation this plugin ever had
        # with it. DSH's side needs no key: it is always the `dsh` directory.
        #
        # codex has no "add a thread to a project" API, so growing the group
        # rotates it (import the union under a fresh idempotency key, delete the
        # replaced project). That changes the project id, so hand-made ordering
        # inside that project is lost when a rotation actually happens; an
        # unchanged thread set reuses the existing project untouched.
        #
        # Set to null to leave codex's own project list alone.
        projectName: agent-room
        # R3 delivery knobs. A room hands each member the content it has not read
        # yet in one lump every segmentMs, rather than line by line. The room's
        # first message and any `@` bypass the timer, so this is also the worst
        # case wait for an unaddressed message.
        # segmentMs: 30000
        # A segment is sealed and a new one started past this many characters, so
        # the member answers in several turns instead of one enormous prompt.
        # maxSegmentChars: 2500
        # How many not-yet-read segments may pile up behind a busy member before
        # the oldest is merged away or dropped (reported as member.shed).
        # maxQueuedSegments: 8
        # A turn that has run this long without finishing is interrupted once;
        # if it still will not finish, its text is requeued and the queue is
        # freed. A single stuck turn otherwise blocks that member forever.
        # queueStallMs: 120000
        # Roster edits made in the UI are saved here and survive a restart.
        # Defaults to $DSH_PROFILE_DIR/agent-room-rooms when omitted.
        # roomsDir: ''
        # The built-in backend is the codex app-server, which needs no entry here.
        # Every other harness this build knows (DSH, Qoder) is also auto-detected:
        # if its binary is on PATH, or — for DSH — this very process is a desktop
        # install with the `acp` profile, then the harness is launched with the
        # right arguments and needs no entry either. Use `backends` only to
        # OVERRIDE that, e.g. to point a harness at a wrapper script or to add a
        # harness this build has never heard of.
        #
        # An entry costs nothing until a member actually names it. Which harnesses
        # the add-member dropdown OFFERS is a separate, user-visible setting:
        # 设置 → 通用 → "Agent 群聊可用后端" (stored in the profile beside the
        # rooms). Detection fills that list automatically until the user ticks
        # anything, after which their choice is kept.
        #
        # What each harness would actually be launched with is only ever read-only
        # information here — a harness that is not detected contributes nothing and
        # the pool reports "no ACP agent configured".
        #
        # backends:
        #   qoder:
        #     agentCommand: 'C:\Users\you\AppData\Local\Programs\Qoder\qoder.exe'
        #     agentArgs: ['--acp']
        #
        # A member is NOT declared here on purpose: declaring `members` would
        # pin every room's roster, and the roster edited in the UI is what the
        # user actually wants to persist. Add members from the
        # `[+ 添加成员]` form instead.
