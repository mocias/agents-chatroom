<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Room · 一起聊聊</title><link rel="stylesheet" href="/app.css"><script defer src="/app.js"></script></head>
<body>
<main class="shell">
  <aside class="sidebar">
    <header class="brand"><span class="brand-icon">a</span><div><strong>Agent Room</strong><small>你的 AI 伙伴，都在这里</small></div></header>
    <div class="search-row"><label class="search"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="搜索 Agent 或群聊" aria-label="搜索 Agent 或群聊"></label><button id="add-agent" class="square" title="添加 Agent" aria-label="添加 Agent">＋</button></div>
    <button id="history-all" class="text-button history-entry"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.6 7M3 4v7h7M12 7v5l3 2"/></svg>搜索聊天记录<span aria-hidden="true">↗</span></button><div class="list-heading"><div class="tabs"><button class="selected" data-filter="all">全部</button><button data-filter="direct">Agents</button><button data-filter="group">群聊</button></div><button id="new-group" class="text-button" title="创建群聊">发起群聊</button></div>
    <nav id="conversations" aria-label="会话列表"></nav>
    <footer class="sidebar-footer"><span id="connection"><i></i>正在连接</span><button id="backends" class="text-button">后端管理</button><button id="settings" class="text-button">外观设置</button></footer>
  </aside>
  <section class="chat" id="chat">
    <div class="welcome" id="welcome"><div class="welcome-mark">a<span>✦</span></div><span class="eyebrow">A LITTLE ROOM FOR BIG IDEAS</span><h1>想法，从一段对话开始。</h1><p>一个安静的空间，容纳你和 AI 伙伴的好想法。<br>单独聊聊，或让不同视角在这里相遇。</p><button id="welcome-add" class="primary">＋ 添加第一个 Agent</button><div class="welcome-features"><div><span class="feature-number">01</span><strong>专注对话</strong><span>和你的 AI 伙伴单独聊聊</span></div><div><span class="feature-number">02</span><strong>让灵感相遇</strong><span>邀请不同 Agent 一起讨论</span></div><div><span class="feature-number">03</span><strong>留住好想法</strong><span>随时搜索、回顾与导出</span></div></div><div class="backend-badges" aria-label="支持的后端"><span>Codex</span><span>DSH</span><span>Qoder</span><span>Claude Code</span><span>WorkBuddy 国内 / 国际版</span></div></div>
    <div id="conversation-view" hidden>
      <header class="chat-header"><div><h1 id="chat-title"></h1><p id="chat-subtitle"></p></div><div class="header-actions"><button id="history-current" class="text-button" title="搜索和导出当前聊天记录">聊天记录</button><span class="chat-tag">CHAT</span><button id="group-actions" class="square" title="群聊管理" aria-label="群聊管理" hidden>⋯</button><button id="members" class="square" title="查看成员" aria-label="查看成员">☷</button></div></header>
      <div id="messages" class="messages" aria-live="polite"></div>
      <section class="composer"><div class="composer-tools"><button id="attach" class="tool-button" title="引用文件或图片" aria-label="文件 / 图片"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>文件 / 图片</span></button><button id="mention" class="tool-button" title="提及 Agent" aria-label="提及 Agent"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M16 8v6a2 2 0 0 0 4 0v-2a8 8 0 1 0-3 6.25"/></svg><span>提及</span></button><div class="tools-dropdown"><button id="tools-toggle" class="tool-button" title="会话工具" aria-label="会话工具" aria-haspopup="menu" aria-expanded="false" aria-controls="tools-menu"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>工具</span><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button><div id="tools-menu" role="menu" aria-label="会话工具" hidden><div class="tools-menu-heading">会话工具</div><button id="alarms" type="button" role="menuitem"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M3 4l3-2m12 0 3 2M5 20l-1 2m15-2 1 2"/></svg><span>闹钟<small>定时提醒与已设闹钟</small></span></button></div></div><span id="activity" role="status" aria-live="polite"></span><button id="stop" hidden>停止回复</button></div><div id="attachments" class="attachments"></div><textarea id="draft" placeholder="发条消息，聊聊你的想法…" aria-label="消息内容"></textarea><footer><span>Enter 发送 · Shift + Enter 换行</span><button id="send" class="primary">发送 <span>↗</span></button></footer></section>
    </div>
  </section>
</main>
<input id="file-input" type="file" multiple hidden>
<dialog id="modal"><form id="modal-form"><header><h2 id="modal-title"></h2><button type="button" id="close-modal" class="square" aria-label="关闭弹窗">×</button></header><div id="modal-content"></div><p id="modal-error" role="alert"></p><footer id="modal-footer"><button type="button" id="cancel-modal">取消</button><button id="modal-submit" class="primary" type="submit">确定</button></footer></form></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
